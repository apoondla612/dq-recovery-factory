name: recovery-gates
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lxml
      - name: acceptance gates
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -q
