[project]
name = "dq-recovery"
version = "0.1.0"
description = "Stream 1 recovery factory for Informatica IDQ rule logic"
requires-python = ">=3.12"
dependencies = ["lxml"]

[project.scripts]
dq = "dq_recovery.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
